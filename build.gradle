plugins {
    id "net.neoforged.gradle.userdev" version "6.0.124"
}

repositories {
    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }
    mavenCentral()
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
}

dependencies {
    minecraft "net.neoforged:neoforge:${loader_version}_minecraft-${minecraft_version}"
    minecraft "net.minecraft:client:${minecraft_version}-sources"
    minecraft "net.minecraft:server:${minecraft_version}-sources"

    compileOnly "net.neoforged:neoforge:${loader_version}_minecraft-${minecraft_version}"
}
